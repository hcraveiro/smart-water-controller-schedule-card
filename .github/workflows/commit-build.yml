name: Commit compiled build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Commit compiled card
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Build compiled schedule card"
          file_pattern: smart-water-controller-schedule-card.js
